name: Gravity
options:
  bundleIdPrefix: com.totowardrobe
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true

targets:
  Gravity:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Gravity
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.totowardrobe.gravity
        PRODUCT_NAME: Gravity
        EXECUTABLE_NAME: Gravity
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Gravity/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
